## Switch the default output to Bluetooth headphones/speakers on connect.
## The hook lives in ~/.local/share/wireplumber/scripts/.

wireplumber.components = [
  {
    name = auto-switch-bluetooth.lua, type = script/lua
    provides = custom.auto-switch-bluetooth
    requires = [ metadata.default ]
  }
]

wireplumber.profiles = {
  main = {
    custom.auto-switch-bluetooth = required
  }
}
